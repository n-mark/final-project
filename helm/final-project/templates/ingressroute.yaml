{{- if .Values.traefik.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: finalproj-public
  namespace: {{ .Values.namespace }}
spec:
  entryPoints:
    - web
  routes:
    # Auth service — register, login, confirm
    - match: Host(`{{ .Values.traefik.host }}`) && PathPrefix(`/api/v1/register`)
      kind: Rule
      services:
        - name: {{ .Values.services.auth.name }}
          port: {{ .Values.services.auth.port }}
    - match: Host(`{{ .Values.traefik.host }}`) && PathPrefix(`/api/v1/login`)
      kind: Rule
      services:
        - name: {{ .Values.services.auth.name }}
          port: {{ .Values.services.auth.port }}
    - match: Host(`{{ .Values.traefik.host }}`) && PathPrefix(`/api/v1/confirm`)
      kind: Rule
      services:
        - name: {{ .Values.services.auth.name }}
          port: {{ .Values.services.auth.port }}

    # Profile service
    - match: Host(`{{ .Values.traefik.host }}`) && PathPrefix(`/api/v1/profile`)
      kind: Rule
      services:
        - name: {{ .Values.services.profile.name }}
          port: {{ .Values.services.profile.port }}

    # Advert command service — adverts CRUD + reference data
    - match: Host(`{{ .Values.traefik.host }}`) && PathPrefix(`/api/v1/adverts`)
      kind: Rule
      services:
        - name: {{ .Values.services.advertCmd.name }}
          port: {{ .Values.services.advertCmd.port }}
    - match: Host(`{{ .Values.traefik.host }}`) && PathPrefix(`/api/v1/categories`)
      kind: Rule
      services:
        - name: {{ .Values.services.advertCmd.name }}
          port: {{ .Values.services.advertCmd.port }}
    - match: Host(`{{ .Values.traefik.host }}`) && PathPrefix(`/api/v1/brands`)
      kind: Rule
      services:
        - name: {{ .Values.services.advertCmd.name }}
          port: {{ .Values.services.advertCmd.port }}
    - match: Host(`{{ .Values.traefik.host }}`) && PathPrefix(`/api/v1/colors`)
      kind: Rule
      services:
        - name: {{ .Values.services.advertCmd.name }}
          port: {{ .Values.services.advertCmd.port }}

    # Advert query service — search
    - match: Host(`{{ .Values.traefik.host }}`) && PathPrefix(`/api/v1/search`)
      kind: Rule
      services:
        - name: {{ .Values.services.advertQuery.name }}
          port: {{ .Values.services.advertQuery.port }}

    # Order service
    - match: Host(`{{ .Values.traefik.host }}`) && PathPrefix(`/api/v1/order`)
      kind: Rule
      services:
        - name: {{ .Values.services.order.name }}
          port: {{ .Values.services.order.port }}

    # Billing service — transactions
    - match: Host(`{{ .Values.traefik.host }}`) && PathPrefix(`/api/v1/transaction`)
      kind: Rule
      services:
        - name: {{ .Values.services.billing.name }}
          port: {{ .Values.services.billing.port }}

    # Delivery service
    - match: Host(`{{ .Values.traefik.host }}`) && PathPrefix(`/api/v1/delivery`)
      kind: Rule
      services:
        - name: {{ .Values.services.delivery.name }}
          port: {{ .Values.services.delivery.port }}
    - match: Host(`{{ .Values.traefik.host }}`) && PathPrefix(`/api/v1/providers`)
      kind: Rule
      services:
        - name: {{ .Values.services.delivery.name }}
          port: {{ .Values.services.delivery.port }}

    # Notification service
    - match: Host(`{{ .Values.traefik.host }}`) && PathPrefix(`/api/v1/notification`)
      kind: Rule
      services:
        - name: {{ .Values.services.notification.name }}
          port: {{ .Values.services.notification.port }}
    - match: Host(`{{ .Values.traefik.host }}`) && PathPrefix(`/api/v1/notifications`)
      kind: Rule
      services:
        - name: {{ .Values.services.notification.name }}
          port: {{ .Values.services.notification.port }}

    # Dialog service
    - match: Host(`{{ .Values.traefik.host }}`) && PathPrefix(`/api/v1/dialog`)
      kind: Rule
      services:
        - name: {{ .Values.services.dialog.name }}
          port: {{ .Values.services.dialog.port }}
    - match: Host(`{{ .Values.traefik.host }}`) && PathPrefix(`/api/v1/conversations`)
      kind: Rule
      services:
        - name: {{ .Values.services.dialog.name }}
          port: {{ .Values.services.dialog.port }}

    # BFF aggregate endpoints
    - match: Host(`{{ .Values.traefik.host }}`) && PathPrefix(`/api/v1/bff`)
      kind: Rule
      services:
        - name: {{ .Values.services.bff.name }}
          port: {{ .Values.services.bff.port }}
{{- end }}