{{- if .Values.opensearch.enabled }}
# The OpenSearch cluster itself is managed by the upstream `opensearch` Helm
# chart (see Chart.yaml dependencies / values.yaml `opensearch` section).
# This template only provisions the advert index-template and a one-shot Job
# that uploads it to the cluster after it becomes ready.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-index-template
  namespace: {{ .Values.namespace }}
data:
  template.json: |
    {
      "index_patterns": ["{{ .Values.opensearch.index }}-*"],
      "template": {
        "settings": {
          "number_of_shards": 3,
          "number_of_replicas": 2
        },
        "mappings": {
          "properties": {
            "id": { "type": "keyword" },
            "title": { "type": "text" },
            "description": { "type": "text" },
            "condition": { "type": "keyword" },
            "size_letter": { "type": "keyword" },
            "size_number": { "type": "integer" },
            "brand": { "type": "keyword" },
            "price": { "type": "integer" },
            "gender": { "type": "keyword" },
            "shipping_available": { "type": "boolean" },
            "created_by": { "type": "keyword" },
            "created_time": { "type": "date" },
            "current_state": { "type": "keyword" },
            "address": { "type": "text" },
            "colors": { "type": "keyword" },
            "categories": { "type": "keyword" },
            "pictures": { "type": "keyword" },
            "embedding": { "type": "dense_vector", "dims": 768 }
          }
        }
      }
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: opensearch-create-template
  namespace: {{ .Values.namespace }}
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-opensearch
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              until curl -fsS http://opensearch:9200/_cluster/health; do
                echo "waiting for opensearch..."; sleep 3;
              done
      containers:
        - name: create-template
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              curl -X PUT http://opensearch:9200/_index_template/adverts-template \
                -H 'Content-Type: application/json' \
                -d @/template/template.json && echo "template created"
          volumeMounts:
            - name: template
              mountPath: /template
      volumes:
        - name: template
          configMap:
            name: opensearch-index-template
{{- end }}