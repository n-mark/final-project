{{- if .Values.opensearch.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-config
  namespace: {{ .Values.namespace }}
data:
  OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
  DISABLE_INSTALL_DEMO_CONFIG: "true"
  DISABLE_SECURITY_PLUGIN: "true"
  discovery.seed_hosts: "opensearch-0.opensearch,opensearch-1.opensearch,opensearch-2.opensearch"
  cluster.initial_master_nodes: "opensearch-0,opensearch-1,opensearch-2"
  cluster.name: "finalproj-opensearch"
---
apiVersion: v1
kind: Secret
metadata:
  name: opensearch-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  OPENSEARCH_USERNAME: "admin"
  OPENSEARCH_PASSWORD: "admin_password"
---
apiVersion: v1
kind: Service
metadata:
  name: opensearch
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: opensearch
  ports:
    - name: http
      port: 9200
      targetPort: 9200
    - name: transport
      port: 9300
      targetPort: 9300
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opensearch
  namespace: {{ .Values.namespace }}
spec:
  serviceName: opensearch
  replicas: {{ .Values.opensearch.replicas }}
  selector:
    matchLabels:
      app: opensearch
  template:
    metadata:
      labels:
        app: opensearch
    spec:
      initContainers:
        - name: set-vm-max-map
          image: busybox:1.36
          command: ["sysctl", "-w", "vm.max_map_count=262144"]
          securityContext:
            privileged: true
      containers:
        - name: opensearch
          image: {{ .Values.opensearch.image }}
          ports:
            - containerPort: 9200
            - containerPort: 9300
          envFrom:
            - configMapRef:
                name: opensearch-config
            - secretRef:
                name: opensearch-secret
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
          resources:
            requests: { cpu: "300m", memory: "1Gi" }
            limits:   { cpu: "1", memory: "2Gi" }
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.opensearch.storage }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opensearch-index-template
  namespace: {{ .Values.namespace }}
data:
  template.json: |
    {
      "index_patterns": ["{{ .Values.opensearch.index }}-*"],
      "template": {
        "settings": {
          "number_of_shards": 3,
          "number_of_replicas": 2
        },
        "mappings": {
          "properties": {
            "id": { "type": "keyword" },
            "title": { "type": "text" },
            "description": { "type": "text" },
            "condition": { "type": "keyword" },
            "size_letter": { "type": "keyword" },
            "size_number": { "type": "integer" },
            "brand": { "type": "keyword" },
            "price": { "type": "integer" },
            "gender": { "type": "keyword" },
            "shipping_available": { "type": "boolean" },
            "created_by": { "type": "keyword" },
            "created_time": { "type": "date" },
            "current_state": { "type": "keyword" },
            "address": { "type": "text" },
            "colors": { "type": "keyword" },
            "categories": { "type": "keyword" },
            "pictures": { "type": "keyword" },
            "embedding": { "type": "dense_vector", "dims": 768 }
          }
        }
      }
    }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: opensearch-create-template
  namespace: {{ .Values.namespace }}
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-opensearch
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              until curl -fsS http://opensearch:9200/_cluster/health; do
                echo "waiting for opensearch..."; sleep 3;
              done
      containers:
        - name: create-template
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              curl -X PUT http://opensearch:9200/_index_template/adverts-template \
                -H 'Content-Type: application/json' \
                -d @/template/template.json && echo "template created"
          volumeMounts:
            - name: template
              mountPath: /template
      volumes:
        - name: template
          configMap:
            name: opensearch-index-template
{{- end }}