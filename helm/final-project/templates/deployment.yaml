{{- range $key, $svc := .Values.services }}
{{- $name := $svc.name | default ($key | kebabcase) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ $.Values.namespace }}
data:
  {{- if $svc.env }}
  {{- range $k, $v := $svc.env }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- else }}
  APP_PORT: {{ $svc.port | quote }}
  {{- end }}
{{- if $svc.secretData }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-secret
  namespace: {{ $.Values.namespace }}
type: Opaque
stringData:
  {{- range $k, $v := $svc.secretData }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
  labels:
    app: {{ $name }}
spec:
  replicas: {{ $.Values.replicas.default }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
    spec:
      {{- if or $svc.waitForPg $svc.waitForKafka }}
      initContainers:
        {{- if $svc.waitForPg }}
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z {{ $svc.waitForPg }} 5432; do
                echo "waiting for {{ $svc.waitForPg }}..."; sleep 2;
              done
        {{- end }}
        {{- if $svc.waitForKafka }}
        - name: wait-for-kafka
          image: bitnamilegacy/kafka:4.0.0-debian-12-r10
          command:
            - sh
            - -c
            - |
              until /opt/bitnami/kafka/bin/kafka-metadata-quorum.sh --bootstrap-server kafka:9092 describe --status 2>/dev/null | grep -q 'CurrentVoters'; do
                echo "waiting for kafka quorum..."; sleep 2;
              done
        {{- end }}
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ printf "%s/%s:%s" $.Values.image.registry $svc.image $.Values.image.tag }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          envFrom:
            - configMapRef:
                name: {{ $name }}-config
{{- if $svc.secretData }}
            - secretRef:
                name: {{ $name }}-secret
{{- end }}
            - secretRef:
                name: shared-secrets
          readinessProbe:
            httpGet: { path: {{ default "/health" $svc.probePath | quote }}, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: {{ default "/health" $svc.probePath | quote }}, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            {{- toYaml $.Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.namespace }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
{{- end }}