volumes:
  kafka-data:
  redis-data:
  opensearch-data:
  prometheus-data:
  pg-shared-data:
  pg-profiles-data:
  pg-orders-data:
  pg-billing-data:
  pg-notifications-data:
  pg-delivery-data:
  pg-advertcmd-data:
  pg-dialog-data:
  pg-validation-data:
  pg-gis-data:

