---
# Per-service Postgres instances: profile, order, billing, notification, delivery, advert-cmd, dialog
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-profiles-config
  namespace: final-proj
data:
  POSTGRES_USER: "profile_user"
  POSTGRES_DB: "profiledb"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-profiles-secret
  namespace: final-proj
type: Opaque
stringData:
  POSTGRES_PASSWORD: "profile_password"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-profiles-pvc
  namespace: final-proj
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-profiles
  namespace: final-proj
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-profiles
  template:
    metadata:
      labels:
        app: postgres-profiles
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: postgres-profiles-config
            - secretRef:
                name: postgres-profiles-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "200m", memory: "256Mi" }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-profiles-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-profiles
  namespace: final-proj
spec:
  selector:
    app: postgres-profiles
  ports:
    - port: 5432
      targetPort: 5432
