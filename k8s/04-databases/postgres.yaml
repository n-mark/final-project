---
# Shared Postgres used by auth-service and any service without its own instance.
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-shared-config
  namespace: final-proj
data:
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "usersdb"
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-shared-secret
  namespace: final-proj
type: Opaque
stringData:
  POSTGRES_PASSWORD: "postgres_password"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-shared-pvc
  namespace: final-proj
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-shared
  namespace: final-proj
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-shared
  template:
    metadata:
      labels:
        app: postgres-shared
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: postgres-shared-config
            - secretRef:
                name: postgres-shared-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-shared-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-shared
  namespace: final-proj
spec:
  selector:
    app: postgres-shared
  ports:
    - port: 5432
      targetPort: 5432
