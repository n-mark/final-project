apiVersion: v1
kind: Secret
metadata:
  name: shared-secrets
  namespace: final-proj
type: Opaque
stringData:
  # Postgres
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres_password"
  # RabbitMQ
  RABBIT_USER: "rabbit"
  RABBIT_PASSWORD: "rabbit_password"
  # Kafka (optional, used if SASL enabled)
  KAFKA_USERNAME: "kafka"
  KAFKA_PASSWORD: "kafka_password"
  # OpenSearch
  OPENSEARCH_USERNAME: "admin"
  OPENSEARCH_PASSWORD: "admin_password"
  # S3 / Object storage (used by advert-cmd-svc upload)
  S3_ACCESS_KEY: "REPLACE_ME"
  S3_SECRET_KEY: "REPLACE_ME"
  # Internal token for service-to-service calls
  INTERNAL_TOKEN: "finalproj_internal_token_change_me"
