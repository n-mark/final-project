---
# Job that creates the OpenSearch index template after cluster is ready.
apiVersion: batch/v1
kind: Job
metadata:
  name: opensearch-create-template
  namespace: final-proj
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-opensearch
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              until curl -fsS http://opensearch:9200/_cluster/health; do
                echo "waiting for opensearch..."; sleep 3;
              done
      containers:
        - name: create-template
          image: curlimages/curl:latest
          command:
            - sh
            - -c
            - |
              curl -X PUT http://opensearch:9200/_index_template/adverts-template \
                -H 'Content-Type: application/json' \
                -d @/template/template.json && echo "template created"
          volumeMounts:
            - name: template
              mountPath: /template
      volumes:
        - name: template
          configMap:
            name: opensearch-index-template
