---
apiVersion: v1
kind: ConfigMap
metadata:
  name: advert-postprocessor-config
  namespace: final-proj
data:
  BROKER_TYPE: "KAFKA"
  KAFKA_BROKERS: "kafka:9092"
  POST_VALIDATION_TOPIC: "post-validation"
  CONSUMER_GROUP_ID: "advert-postprocessor"
  ADVERT_SERVICE_URL: "http://advert-cmd-svc:8080"
  GIS_DATABASE_URL: "postgres://gis_user:gis_password@postgres-gis:5432/gis?sslmode=disable"
  OPENSEARCH_URL: "http://opensearch:9200"
  OPENSEARCH_INDEX: "adverts"
  EMBEDDINGS_ENABLED: "false"
  METRICS_ADDR: ":9090"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: advert-postprocessor
  namespace: final-proj
spec:
  replicas: 1
  selector:
    matchLabels:
      app: advert-postprocessor
  template:
    metadata:
      labels:
        app: advert-postprocessor
    spec:
      initContainers:
        - name: wait-for-gis
          image: busybox:1.36
          command: ["sh","-c","until nc -z postgres-gis 5432; do echo waiting for postgres-gis...; sleep 2; done"]
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "50m", memory: "32Mi" }
      containers:
        - name: advert-postprocessor
          image: mblkuta/advert-postprocessor:finalproj-latest
          imagePullPolicy: Always
          ports:
            - name: metrics
              containerPort: 9090
          envFrom:
            - configMapRef:
                name: advert-postprocessor-config
            - secretRef:
                name: shared-secrets
          readinessProbe:
            httpGet: { path: /metrics, port: metrics }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /metrics, port: metrics }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits:   { cpu: "300m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: advert-postprocessor
  namespace: final-proj
spec:
  selector:
    app: advert-postprocessor
  ports:
    - name: metrics
      port: 9090
      targetPort: 9090