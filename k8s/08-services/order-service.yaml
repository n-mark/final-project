---
apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-config
  namespace: final-proj
data:
  APP_PORT: "8080"
  BROKER_TYPE: "KAFKA"
  PG_HOST: "postgres-orders"
  PG_PORT: "5432"
  PG_DATABASE: "orderdb"
  PG_SSLMODE: "disable"
  KAFKA_BROKERS: "kafka:9092"
  ADVERT_CMD_URL: "http://advert-cmd-svc:8080"
  BILLING_URL: "http://billing-svc:8080"
  DELIVERY_URL: "http://delivery-service:8080"
---
apiVersion: v1
kind: Secret
metadata:
  name: order-service-secret
  namespace: final-proj
type: Opaque
stringData:
  PG_USER: "order_user"
  PG_PASSWORD: "order_password"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: final-proj
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh","-c","until nc -z postgres-orders 5432; do echo waiting...; sleep 2; done"]
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "50m", memory: "32Mi" }
      containers:
        - name: order-service
          image: mblkuta/ordersvc:finalproj-latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: order-service-config
            - secretRef:
                name: order-service-secret
            - secretRef:
                name: shared-secrets
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: final-proj
spec:
  selector:
    app: order-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
