---
apiVersion: v1
kind: ConfigMap
metadata:
  name: advert-validation-svc-config
  namespace: final-proj
data:
  HTTP_ADDR: ":8080"
  KAFKA_BOOTSTRAP_SERVER: "kafka:9092"
  KAFKA_GROUP_ID: "validation-svc"
  PENDING_TOPIC: "pending-queue"
  POST_VALIDATION_TOPIC: "post-validation"
  MOCK_LLM: "true"
  MOCK_AUTO_APPROVE: "true"
  WORKER_COUNT: "4"
  CLAIM_BATCH_SIZE: "10"
  POLL_INTERVAL: "2s"
  LEASE_TIMEOUT: "5m"
  MAX_ATTEMPTS: "3"
  HYBRID_CONFIDENCE_THRESHOLD: "0.8"
---
apiVersion: v1
kind: Secret
metadata:
  name: advert-validation-svc-secret
  namespace: final-proj
type: Opaque
stringData:
  DATABASE_URL: "postgres://validation_user:validation_password@postgres-validation:5432/validationdb?sslmode=disable"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: advert-validation-svc
  namespace: final-proj
spec:
  replicas: 1
  selector:
    matchLabels:
      app: advert-validation-svc
  template:
    metadata:
      labels:
        app: advert-validation-svc
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh","-c","until nc -z postgres-validation 5432; do echo waiting...; sleep 2; done"]
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "50m", memory: "32Mi" }
      containers:
        - name: advert-validation-svc
          image: mblkuta/advert-validation-svc:finalproj-latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: advert-validation-svc-config
            - secretRef:
                name: advert-validation-svc-secret
            - secretRef:
                name: shared-secrets
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: advert-validation-svc
  namespace: final-proj
spec:
  selector:
    app: advert-validation-svc
  ports:
    - name: http
      port: 8080
      targetPort: 8080