---
apiVersion: v1
kind: ConfigMap
metadata:
  name: advert-cmd-svc-config
  namespace: final-proj
data:
  HTTP_ADDR: ":8080"
  BROKER_TYPE: "KAFKA"
  KAFKA_BROKERS: "kafka:9092"
  VALIDATION_TOPIC: "pending-queue"
  POST_VALIDATION_TOPIC: "post-validation"
  VALIDATION_GROUP_ID: "advert-cmd-svc-validation"
  OUTBOX_INTERVAL: "1s"
  OUTBOX_BATCH_SIZE: "100"
  LOG_LEVEL: "info"
  S3_ENDPOINT: ""
  S3_REGION: "ru-1"
  S3_BUCKET: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: advert-cmd-svc-secret
  namespace: final-proj
type: Opaque
stringData:
  DATABASE_URL: "postgres://advertcmd_user:advertcmd_password@postgres-advertcmd:5432/advertcmddb?sslmode=disable"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: advert-cmd-svc
  namespace: final-proj
spec:
  replicas: 1
  selector:
    matchLabels:
      app: advert-cmd-svc
  template:
    metadata:
      labels:
        app: advert-cmd-svc
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh","-c","until nc -z postgres-advertcmd 5432; do echo waiting...; sleep 2; done"]
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "50m", memory: "32Mi" }
      containers:
        - name: advert-cmd-svc
          image: mblkuta/advert-cmd-svc:finalproj-latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: advert-cmd-svc-config
            - secretRef:
                name: advert-cmd-svc-secret
            - secretRef:
                name: shared-secrets
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: advert-cmd-svc
  namespace: final-proj
spec:
  selector:
    app: advert-cmd-svc
  ports:
    - name: http
      port: 8080
      targetPort: 8080