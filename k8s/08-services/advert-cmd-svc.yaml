---
apiVersion: v1
kind: ConfigMap
metadata:
  name: advert-cmd-svc-config
  namespace: final-proj
data:
  APP_PORT: "8080"
  BROKER_TYPE: "KAFKA"
  PG_HOST: "postgres-advertcmd"
  PG_PORT: "5432"
  PG_DATABASE: "advertcmddb"
  PG_SSLMODE: "disable"
  KAFKA_BROKERS: "kafka:9092"
  OPENSEARCH_URL: "http://opensearch:9200"
  S3_ENDPOINT: ""
  S3_BUCKET: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: advert-cmd-svc-secret
  namespace: final-proj
type: Opaque
stringData:
  PG_USER: "advertcmd_user"
  PG_PASSWORD: "advertcmd_password"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: advert-cmd-svc
  namespace: final-proj
spec:
  replicas: 1
  selector:
    matchLabels:
      app: advert-cmd-svc
  template:
    metadata:
      labels:
        app: advert-cmd-svc
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh","-c","until nc -z postgres-advertcmd 5432; do echo waiting...; sleep 2; done"]
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "50m", memory: "32Mi" }
      containers:
        - name: advert-cmd-svc
          image: mblkuta/advert-cmd-svc:finalproj-latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: advert-cmd-svc-config
            - secretRef:
                name: advert-cmd-svc-secret
            - secretRef:
                name: shared-secrets
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: advert-cmd-svc
  namespace: final-proj
spec:
  selector:
    app: advert-cmd-svc
  ports:
    - name: http
      port: 8080
      targetPort: 8080
