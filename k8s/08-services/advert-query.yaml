---
apiVersion: v1
kind: ConfigMap
metadata:
  name: advert-query-config
  namespace: final-proj
data:
  APP_PORT: "8080"
  OPENSEARCH_URL: "http://opensearch:9200"
  ADVERT_INDEX: "adverts-*"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: advert-query
  namespace: final-proj
spec:
  replicas: 1
  selector:
    matchLabels:
      app: advert-query
  template:
    metadata:
      labels:
        app: advert-query
    spec:
      containers:
        - name: advert-query
          image: mblkuta/advert-query:finalproj-latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: advert-query-config
            - secretRef:
                name: shared-secrets
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: advert-query
  namespace: final-proj
spec:
  selector:
    app: advert-query
  ports:
    - name: http
      port: 8080
      targetPort: 8080
