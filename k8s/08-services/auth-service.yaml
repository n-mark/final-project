---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-config
  namespace: final-proj
data:
  DB_HOST: "postgres-shared"
  DB_PORT: "5432"
  DB_NAME: "usersdb"
  DB_MAX_RETRIES: "30"
  DB_RETRY_INTERVAL: "3"
  APP_PORT: ":8080"
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-service-secret
  namespace: final-proj
type: Opaque
stringData:
  DB_USER: "postgres"
  DB_PASSWORD: "postgres_password"
  JWT_SECRET: "changeme_super_secret_jwt_key_please_rotate"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: final-proj
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres-shared 5432; do
                echo "waiting for postgres-shared..."; sleep 2;
              done
          resources:
            requests: { cpu: "10m", memory: "16Mi" }
            limits:   { cpu: "50m", memory: "32Mi" }
      containers:
        - name: auth-service
          image: mblkuta/auth-service:finalproj-latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: auth-service-config
            - secretRef:
                name: auth-service-secret
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits:   { cpu: "200m", memory: "128Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: final-proj
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
