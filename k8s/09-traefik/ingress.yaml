---
# Traefik IngressRoute exposing public APIs.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: finalproj-public
  namespace: final-proj
spec:
  entryPoints:
    - web
  routes:
    # Auth service — register, login, confirm
    - match: Host(`finalproj.local`) && PathPrefix(`/api/v1/register`)
      kind: Rule
      services:
        - name: auth-service
          port: 8080
    - match: Host(`finalproj.local`) && PathPrefix(`/api/v1/login`)
      kind: Rule
      services:
        - name: auth-service
          port: 8080
    - match: Host(`finalproj.local`) && PathPrefix(`/api/v1/confirm`)
      kind: Rule
      services:
        - name: auth-service
          port: 8080

    # Profile service
    - match: Host(`finalproj.local`) && PathPrefix(`/api/v1/profile`)
      kind: Rule
      services:
        - name: profile-service
          port: 8080

    # Advert command service — adverts CRUD + reference data
    - match: Host(`finalproj.local`) && PathPrefix(`/api/v1/adverts`)
      kind: Rule
      services:
        - name: advert-cmd-svc
          port: 8080
    - match: Host(`finalproj.local`) && PathPrefix(`/api/v1/categories`)
      kind: Rule
      services:
        - name: advert-cmd-svc
          port: 8080
    - match: Host(`finalproj.local`) && PathPrefix(`/api/v1/brands`)
      kind: Rule
      services:
        - name: advert-cmd-svc
          port: 8080
    - match: Host(`finalproj.local`) && PathPrefix(`/api/v1/colors`)
      kind: Rule
      services:
        - name: advert-cmd-svc
          port: 8080

    # Advert query service — search
    - match: Host(`finalproj.local`) && PathPrefix(`/api/v1/search`)
      kind: Rule
      services:
        - name: advert-query
          port: 8080

    # Order service
    - match: Host(`finalproj.local`) && PathPrefix(`/api/v1/order`)
      kind: Rule
      services:
        - name: order-service
          port: 8080

    # Billing service — transactions
    - match: Host(`finalproj.local`) && PathPrefix(`/api/v1/transaction`)
      kind: Rule
      services:
        - name: billing-service
          port: 8080

    # Delivery service
    - match: Host(`finalproj.local`) && PathPrefix(`/api/v1/delivery`)
      kind: Rule
      services:
        - name: delivery-service
          port: 8080
    - match: Host(`finalproj.local`) && PathPrefix(`/api/v1/providers`)
      kind: Rule
      services:
        - name: delivery-service
          port: 8080

    # Notification service
    - match: Host(`finalproj.local`) && PathPrefix(`/api/v1/notification`)
      kind: Rule
      services:
        - name: notification-service
          port: 8080
    - match: Host(`finalproj.local`) && PathPrefix(`/api/v1/notifications`)
      kind: Rule
      services:
        - name: notification-service
          port: 8080

    # Dialog service
    - match: Host(`finalproj.local`) && PathPrefix(`/api/v1/dialog`)
      kind: Rule
      services:
        - name: dialog-service
          port: 8080
    - match: Host(`finalproj.local`) && PathPrefix(`/api/v1/conversations`)
      kind: Rule
      services:
        - name: dialog-service
          port: 8080

    # BFF aggregate endpoints
    - match: Host(`finalproj.local`) && PathPrefix(`/api/v1/bff`)
      kind: Rule
      services:
        - name: advert-proj-bff
          port: 8080