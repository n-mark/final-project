---
# Traefik IngressRoute exposing public APIs.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: finalproj-public
  namespace: final-proj
spec:
  entryPoints:
    - web
  routes:
    # Auth service
    - match: Host(`finalproj.local`) && PathPrefix(`/api/v1/auth`)
      kind: Rule
      services:
        - name: auth-service
          port: 8080

    # Profile service
    - match: Host(`finalproj.local`) && PathPrefix(`/api/v1/users`)
      kind: Rule
      services:
        - name: profile-service
          port: 8080

    # Advert command service
    - match: Host(`finalproj.local`) && PathPrefix(`/api/v1/adverts`)
      kind: Rule
      services:
        - name: advert-cmd-svc
          port: 8080

    # Advert query service
    - match: Host(`finalproj.local`) && PathPrefix(`/api/v1/search`)
      kind: Rule
      services:
        - name: advert-query
          port: 8080

    # Order service
    - match: Host(`finalproj.local`) && PathPrefix(`/api/v1/orders`)
      kind: Rule
      services:
        - name: order-service
          port: 8080

    # Billing service
    - match: Host(`finalproj.local`) && PathPrefix(`/api/v1/billing`)
      kind: Rule
      services:
        - name: billing-service
          port: 8080

    # Delivery service
    - match: Host(`finalproj.local`) && PathPrefix(`/api/v1/deliveries`)
      kind: Rule
      services:
        - name: delivery-service
          port: 8080

    # Notification service
    - match: Host(`finalproj.local`) && PathPrefix(`/api/v1/notifications`)
      kind: Rule
      services:
        - name: notification-service
          port: 8080

    # Dialog service
    - match: Host(`finalproj.local`) && PathPrefix(`/api/v1/dialogs`)
      kind: Rule
      services:
        - name: dialog-service
          port: 8080

    # BFF aggregate endpoints
    - match: Host(`finalproj.local`) && PathPrefix(`/api/v1/bff`)
      kind: Rule
      services:
        - name: advert-proj-bff
          port: 8080
